<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops in JS</title>
</head>

<body>
    <script>
        //CODE FOR FOR LOOP
        for (let i = 1; i <= 10; i++) {
            document.write("<br> Abes College");
        }

        const arr = [1, 2, 3, 4, 5];

        for (element of arr) {
            console.log(element);
        }
    </script>
</body>

</html>
