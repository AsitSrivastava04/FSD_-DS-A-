<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops in JS</title>
</head>
<body>
    <script>
        //CODE FOR FOR LOOP
        for (let i = 0; i < 5; i++) {
            console.log("For Loop Iteration: " + i);
        }
    </script>
</body>
</html>
