<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promises</title>
</head>
<body>
    <script>
        function f1()
        {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    document.write("f1() is called<br>");
                    resolve();
                }, 4000);
            });
        }

        function f2()
        {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    document.write("f2() is called<br>");
                    resolve();
                }, 2000);
            });
        }

        f1().then(f2)
        .catch((err) => {
            document.write(err);
            console.log("Error", err);
        });
    </script>
</body>
</html>
